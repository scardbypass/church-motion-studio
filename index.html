<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Motion Studio</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#e8ecff;background:#0b1020}body{margin:0}body.light{color:#18213b;background:#e9efff}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #46518a;border-radius:10px;background:#252e57;color:inherit;padding:10px}button:hover{filter:brightness(1.2)}header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #46518a}header strong{margin-right:auto}main{display:grid;grid-template-columns:290px minmax(320px,1fr) 270px;gap:12px;padding:12px;height:calc(100vh - 87px);box-sizing:border-box}.panel{background:#161d34;border:1px solid #374267;border-radius:16px;padding:16px;overflow:auto}.light .panel{background:#fff}.light button{background:#e5eaff;color:#18213b}h3{margin:0 0 14px}label{display:block;margin:14px 0 5px;font-size:13px}textarea,input,select{box-sizing:border-box;width:100%;background:#0d142a;border:1px solid #46518a;border-radius:9px;color:#fff;padding:10px}.light textarea,.light input,.light select{background:#f3f6ff;color:#18213b}.scene{display:block;width:100%;text-align:left;margin:8px 0}.scene.active{border-color:#7d67ff;background:#493c95;color:white}.preview{width:100%;aspect-ratio:16/9;border-radius:12px;display:flex;justify-content:center;align-items:center;text-align:center;overflow:hidden}.lyrics{white-space:pre-line;font-size:clamp(18px,3vw,42px);font-weight:800;text-shadow:0 4px 15px #0008;padding:24px}.fade{animation:fade 2s ease both}.slide{animation:slide 2s ease both}.zoom{animation:zoom 2s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:translateY(0)}}@keyframes zoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.muted{opacity:.7;font-size:13px}.warning{color:#ffca75;font-size:13px}@media(max-width:1000px){main{grid-template-columns:240px 1fr}.settings{grid-column:1/-1}}</style></head><body>
<header><strong>✦ Church Motion Studio <small>v0.1</small></strong><button id="import">Import TXT</button><button id="open">Open Project</button><button id="save">Save Project</button><button id="theme">☀ / ☾</button><button disabled title="Coming in a later release">Export ZIP (soon)</button></header>
<main><aside class="panel"><h3>Lyrics & Scenes</h3><label>Durasi default (detik)</label><input id="defaultDuration" type="number" min="1" max="300" value="8"><p class="muted">Pisahkan scene dengan satu baris kosong.</p><div id="scenes"></div><button id="add">+ Add Scene</button></aside><section class="panel"><h3>Preview 16:9</h3><div id="preview" class="preview"><div id="previewText" class="lyrics"></div></div><div class="toolbar"><button id="play">▶ Replay Animation</button><span id="status" class="muted">Ready</span></div><p class="warning">Preview prototipe. Rendering MP4, timeline, dan ZIP belum tersedia.</p></section><aside class="panel settings"><h3>Scene Editor</h3><label>Text</label><textarea id="text" rows="7"></textarea><label>Durasi (detik)</label><input id="duration" type="number" min="1" max="300"><label>Background</label><input id="background" type="color" value="#102968"><label>Text color</label><input id="foreground" type="color" value="#ffffff"><label>Animation</label><select id="animation"><option value="none">None</option><option value="fade">Fade</option><option value="slide">Slide Up</option><option value="zoom">Zoom In</option></select><p class="muted">Perubahan disimpan otomatis secara lokal.</p></aside></main>
<script>
const initial=()=>({scenes:[{text:'Ku menang ku menang\nBersama Yesus Tuhan',duration:8,background:'#102968',foreground:'#ffffff',animation:'fade'}],theme:'dark'});
let state;try{state=JSON.parse(localStorage.getItem('cms-autosave'))||initial()}catch{state=initial()}let selected=0;
const $=id=>document.getElementById(id);
function current(){return state.scenes[selected]}
function persist(){localStorage.setItem('cms-autosave',JSON.stringify(state));$('status').textContent='Autosaved • '+new Date().toLocaleTimeString()}
function render(){if(!state.scenes.length)state.scenes.push(initial().scenes[0]);selected=Math.min(selected,state.scenes.length-1);document.body.classList.toggle('light',state.theme==='light');$('scenes').replaceChildren();state.scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='scene'+(selected===i?' active':'');b.textContent=String(i+1).padStart(2,'0')+' · '+s.text.replace(/\n/g,' / ').slice(0,50)+' ('+s.duration+'s)';b.onclick=()=>{selected=i;render()};$('scenes').append(b)});const s=current();$('text').value=s.text;$('duration').value=s.duration;$('background').value=s.background;$('foreground').value=s.foreground;$('animation').value=s.animation;$('preview').style.background=s.background;$('previewText').style.color=s.foreground;$('previewText').textContent=s.text;replay()}
function replay(){const e=$('previewText');e.className='lyrics';void e.offsetWidth;e.className='lyrics '+current().animation}
for(const id of ['text','duration','background','foreground','animation'])$(id).addEventListener('input',()=>{const s=current();s.text=$('text').value;s.duration=Math.max(1,Number($('duration').value)||8);s.background=$('background').value;s.foreground=$('foreground').value;s.animation=$('animation').value;persist();render()});
$('play').onclick=replay;
$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render()};
$('add').onclick=()=>{state.scenes.push({text:'New lyrics',duration:Number($('defaultDuration').value)||8,background:'#102968',foreground:'#ffffff',animation:'none'});selected=state.scenes.length-1;persist();render()};
$('import').onclick=async()=>{const t=await window.studio.importLyrics();if(t===null)return;const blocks=t.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);if(!blocks.length){alert('TXT kosong');return}state.scenes=blocks.map(text=>({text,duration:Number($('defaultDuration').value)||8,background:'#102968',foreground:'#ffffff',animation:'none'}));selected=0;persist();render()};
$('save').onclick=async()=>{$('status').textContent=await window.studio.saveProject(state)?'Project saved':'Save cancelled'};
$('open').onclick=async()=>{try{const p=await window.studio.openProject();if(!p)return;if(!Array.isArray(p.scenes)||!p.scenes.length)throw Error('Invalid scenes');state=p;selected=0;persist();render()}catch(e){alert('Cannot open project: '+e.message)}};
render();
</script></body></html>
